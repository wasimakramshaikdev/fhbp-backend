server {
    listen 80;
    server_name localhost;

    # Client upload size limit (crucial for function hall images/media)
    client_max_body_size 20M;

    # React Single Page Application (SPA)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Django Backend API & Admin
    location ~ ^/(api|admin)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Redundant: Nginx forwards the Authorization header by default,
        # but leaving them in is harmless.
        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;
    }

    # Django Collected Static Files (Served directly by Nginx via Volume)
    location /static/ {
        alias /app/static/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Django User Uploads (Served directly by Nginx via Volume)
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}