      - message
      - success
    HallList:
      type: object
      description: |-
        Compact serializer used for:
        - public search results
        - featured halls
        - homepage listings
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        slug:
          oneOf:
          - type: string
            maxLength: 280
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        address_line1:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        locality:
          type: string
          maxLength: 100
        postal_code:
          type: string
          maxLength: 20
        latitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        longitude:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,6})?$
          nullable: true
        min_capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        max_capacity:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        hall_type:
          $ref: '#/components/schemas/HallTypeEnum'
        base_price_morning:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        base_price_evening:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        base_price_full_day:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        advance_percentage:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
        catering_policy:
          $ref: '#/components/schemas/CateringPolicyEnum'
        veg_plate_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        non_veg_plate_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        decor_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        dj_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        avg_rating:
          type: string
          format: decimal
          pattern: ^-?\d{0,1}(?:\.\d{0,2})?$
        review_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        primary_image:
          type: string
          readOnly: true
        amenities:
          type: array
          items:
            $ref: '#/components/schemas/Amenity'
          readOnly: true
        owner_business:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/HallListStatusEnum'
        approval_status:
          $ref: '#/components/schemas/ApprovalStatusEnum'
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - address_line1
      - amenities
      - created_at
      - id
      - locality
      - name
      - owner_business
      - primary_image
    HallListStatusEnum:
      enum:
      - ACTIVE
      - INACTIVE
      type: string
      description: |-
        * `ACTIVE` - Active
        * `INACTIVE` - Inactive
    HallMonthAvailabilityData:
      type: object
      properties:
        year:
          type: integer
        month:
          type: integer
        calendar: {}
      required:
      - calendar
      - month
      - year
    HallMonthAvailabilityResponse:
      type: object
      properties:
        success:
          type: boolean
        message:
          type: string
        data:
          $ref: '#/components/schemas/HallMonthAvailabilityData'
      required:
      - data
      - message
      - success
    HallTypeEnum:
      enum:
      - AC
      - NON_AC
      - OPEN_LAWN
      - HYBRID
      - CONVENTION
      type: string
      description: |-
        * `AC` - AC Banquet Hall
        * `NON_AC` - Non-AC Hall
        * `OPEN_LAWN` - Open Lawn
        * `HYBRID` - Hybrid (Lawn & Hall)
        * `CONVENTION` - Convention Center
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        timestamp:
          type: string
          format: date-time
      required:
      - service
      - status
      - timestamp
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    OwnerProfile:
      type: object
      description: |-
        Serializer for hall owner profile information.

        The actual bank account number is write-only.
        A masked version is returned in API responses.
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        business_name:
          type: string
          maxLength: 255
        registration_number:
          type: string
          maxLength: 100
        pan_gst_number:
          type: string
          maxLength: 50
        address:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 100
        locality:
          type: string
          maxLength: 100
        bank_account_holder:
          type: string
          maxLength: 150
        masked_bank_account:
          type: string
          readOnly: true
        bank_ifsc_code:
          type: string
          maxLength: 20
        verification_status:
          $ref: '#/components/schemas/VerificationStatusEnum'
        payout_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - business_name
      - created_at
      - id
      - masked_bank_account
      - updated_at
    PasswordResetConfirmRequest:
      type: object
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - new_password
      - token
    PasswordResetRequestRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedUserProfileUpdateRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        phone:
          type: string
          nullable: true
          maxLength: 20
        avatar_url:
          oneOf:
          - type: string
            format: uri
            maxLength: 500
          - type: string
            maxLength: 0
        business_name:
          type: string
          minLength: 1
          maxLength: 255
        registration_number:
          type: string
          maxLength: 100
        pan_gst_number:
          type: string
          maxLength: 50
        address:
          type: string
          maxLength: 255
        city:
          type: string
          minLength: 1
          maxLength: 100
        locality:
          type: string
          maxLength: 100
        bank_account_holder:
          type: string
          maxLength: 150
        bank_account_number:
          type: string
          maxLength: 50
        bank_ifsc_code:
          type: string
          maxLength: 20
    ReadinessResponse:
      type: object
      properties:
        status:
          type: string
        dependencies:
          type: object
          additionalProperties: {}
        timestamp:
          type: string
          format: date-time
      required:
      - dependencies
      - status
      - timestamp
    RefreshTokenResponse:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/TokenResponse'
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
      required:
      - access_token
      - expires_in
      - refresh_token
      - tokens
    SlotBlockRequestRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/SlotEnum'
        reason:
          type: string
          maxLength: 255
      required:
      - date
      - slot
    SlotEnum:
      enum:
      - MORNING
      - EVENING
      - FULL_DAY
      type: string
      description: |-
        * `MORNING` - Morning (08:00 - 14:00)
        * `EVENING` - Evening (16:00 - 23:00)
        * `FULL_DAY` - Full Day (08:00 - 23:00)
    SlotUnblockRequestRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/SlotEnum'
      required:
      - date
      - slot
    Status115Enum:
      enum:
      - PAYMENT_PENDING
      - PENDING_OWNER_CONFIRMATION
      - CONFIRMED
      - REJECTED
      - CANCELLED_BY_CUSTOMER
      - CANCELLED_BY_OWNER
      - CANCELLED_BY_ADMIN
      - COMPLETED
      - DISPUTED
      - REFUND_PENDING
      - REFUNDED
      type: string
      description: |-
        * `PAYMENT_PENDING` - Payment Pending
        * `PENDING_OWNER_CONFIRMATION` - Pending Owner Confirmation
        * `CONFIRMED` - Confirmed
        * `REJECTED` - Declined by Owner
        * `CANCELLED_BY_CUSTOMER` - Cancelled by Customer
        * `CANCELLED_BY_OWNER` - Cancelled by Owner
        * `CANCELLED_BY_ADMIN` - Cancelled by Admin
        * `COMPLETED` - Completed
        * `DISPUTED` - Disputed
        * `REFUND_PENDING` - Refund Pending
        * `REFUNDED` - Refunded
    TimeSlotEnum:
      enum:
      - MORNING
      - EVENING
      - FULL_DAY
      type: string
      description: |-
        * `MORNING` - Morning (08:00 - 14:00)
        * `EVENING` - Evening (16:00 - 23:00)
        * `FULL_DAY` - Full Day (08:00 - 23:00)
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
