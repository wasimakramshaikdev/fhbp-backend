      description: |-
        * `CUSTOMER` - CUSTOMER
        * `OWNER` - OWNER
    VerificationStatusEnum:
      enum:
      - PENDING
      - VERIFIED
      - REJECTED
      - SUSPENDED
      type: string
      description: |-
        * `PENDING` - Pending Verification
        * `VERIFIED` - Verified
        * `REJECTED` - Rejected
        * `SUSPENDED` - Suspended
  securitySchemes:
    JWTAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
