        guest_count:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        special_requests:
          type: string
        has_catering:
          type: boolean
        catering_plate_type:
          type: string
          maxLength: 20
        catering_plate_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        has_decor:
