      required:
      - created_at
      - email
      - full_name
      - id
      - is_active
      - is_verified
      - owner_profile
      - role
      - updated_at
    UserProfileRoleEnum:
      enum:
      - CUSTOMER
      - OWNER
      - ADMIN
      type: string
      description: |-
        * `CUSTOMER` - Customer
        * `OWNER` - Hall Owner
        * `ADMIN` - Super Admin
    UserRegistrationRequest:
      type: object
      properties:
        full_name:
          type: string
          minLength: 1
          maxLength: 150
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          nullable: true
          maxLength: 20
        password:
          type: string
          writeOnly: true
          minLength: 8
        role:
          allOf:
          - $ref: '#/components/schemas/UserRegistrationRoleEnum'
          default: CUSTOMER
        business_name:
          type: string
          maxLength: 255
        registration_number:
          type: string
          maxLength: 100
        pan_gst_number:
          type: string
          maxLength: 50
        city:
          type: string
          minLength: 1
          default: Hyderabad
          maxLength: 100
        locality:
          type: string
          maxLength: 100
      required:
      - email
      - full_name
      - password
    UserRegistrationRoleEnum:
      enum:
      - CUSTOMER
      - OWNER
