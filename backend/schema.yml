components:
  schemas:
    Amenity:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 100
        slug:
          oneOf:
          - type: string
            maxLength: 100
            pattern: ^[-a-zA-Z0-9_]+$
          - type: string
            maxLength: 0
        icon_name:
          type: string
          maxLength: 50
      required:
      - id
      - name
    ApprovalStatusEnum:
      enum:
      - DRAFT
      - UNDER_REVIEW
      - APPROVED
      - REJECTED
      - SUSPENDED
      - DEACTIVATED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `UNDER_REVIEW` - Under Review
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `SUSPENDED` - Suspended
        * `DEACTIVATED` - Deactivated
    AuthResponse:
      type: object
      properties:
        tokens:
          $ref: '#/components/schemas/TokenResponse'
        user:
          $ref: '#/components/schemas/UserProfile'
        access_token:
          type: string
        refresh_token:
          type: string
        expires_in:
          type: integer
      required:
      - access_token
      - expires_in
      - refresh_token
      - tokens
      - user
    AvailabilityCheckRequestCateringTypeEnum:
      enum:
      - VEG
      - NON_VEG
      type: string
      description: |-
        * `VEG` - Vegetarian
        * `NON_VEG` - Non-Vegetarian
    AvailabilityCheckRequestRequest:
      type: object
      properties:
        date:
          type: string
          format: date
        slot:
          $ref: '#/components/schemas/SlotEnum'
        guest_count:
          type: integer
          minimum: 1
        has_catering:
          type: boolean
          default: false
        catering_type:
          allOf:
          - $ref: '#/components/schemas/AvailabilityCheckRequestCateringTypeEnum'
          default: VEG
        has_decor:
          type: boolean
          default: false
        has_dj:
          type: boolean
          default: false
      required:
      - date
      - slot
    AvailabilityQuotation:
      type: object
      properties:
        hall_rent:
          type: number
          format: double
        has_catering:
          type: boolean
        catering_plate_type:
          type: string
        per_plate_price:
          type: number
          format: double
        catering_amount:
          type: number
          format: double
        has_decor:
          type: boolean
        decor_amount:
          type: number
          format: double
        has_dj:
          type: boolean
        dj_amount:
          type: number
          format: double
        subtotal:
          type: number
          format: double
        tax_rate:
          type: number
          format: double
        tax_amount:
          type: number
          format: double
        total_amount:
          type: number
          format: double
        advance_percentage:
          type: number
          format: double
        advance_amount:
          type: number
          format: double
        balance_amount:
          type: number
          format: double
      required:
      - advance_amount
      - advance_percentage
      - balance_amount
      - catering_amount
      - catering_plate_type
      - decor_amount
      - dj_amount
      - hall_rent
      - has_catering
      - has_decor
      - has_dj
      - per_plate_price
      - subtotal
      - tax_amount
      - tax_rate
      - total_amount
    BookingCancellationRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
      required:
      - reason
    BookingCreateIntentCateringTypeEnum:
      enum:
      - VEG
      - NON_VEG
      type: string
      description: |-
        * `VEG` - VEG
        * `NON_VEG` - NON_VEG
    BookingCreateIntentRequest:
      type: object
      properties:
        hall_id:
          type: string
          format: uuid
        event_type:
          allOf:
          - $ref: '#/components/schemas/EventTypeEnum'
          default: WEDDING
        event_date:
          type: string
          format: date
        time_slot:
          $ref: '#/components/schemas/TimeSlotEnum'
        guest_count:
          type: integer
          minimum: 1
        contact_name:
          type: string
          minLength: 1
          maxLength: 150
        contact_phone:
          type: string
          minLength: 1
          maxLength: 20
        special_requests:
          type: string
          default: ''
        has_catering:
          type: boolean
          default: false
        catering_type:
          allOf:
          - $ref: '#/components/schemas/BookingCreateIntentCateringTypeEnum'
          default: VEG
        has_decor:
          type: boolean
          default: false
        has_dj:
          type: boolean
          default: false
      required:
      - contact_name
      - contact_phone
      - event_date
      - guest_count
      - hall_id
      - time_slot
    BookingDetail:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        booking_number:
          type: string
          maxLength: 30
        customer_id:
