openapi: 3.0.3
info:
  title: HallBook Function Hall Marketplace API
  version: 1.0.0
  description: Production-grade Function Hall Booking API for Customers, Owners, and
    Super Admins
paths:
  /api/v1/admin/audit-logs/:
    get:
      operationId: v1_admin_audit_logs_retrieve
      description: Super Admin filterable immutable audit trail.
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/bookings/:
    get:
      operationId: v1_admin_bookings_retrieve
      description: Super Admin real-time monitor across all marketplace bookings.
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/dashboard/:
    get:
      operationId: v1_admin_dashboard_retrieve
      description: |-
        High-level platform metrics for Super Admin (Wireframe Admin Screen 1):
        Total halls, Active owners, Bookings MTD, Commission revenue MTD, and Pending Approvals queue.
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/disputes/:
    get:
      operationId: v1_admin_disputes_retrieve
      description: Super Admin listing of all platform dispute cases.
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/disputes/{id}/resolve/:
    post:
      operationId: v1_admin_disputes_resolve_create
      description: 'Super Admin settles a dispute: issues refund to customer or releases
        funds to owner.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/halls/:
    get:
      operationId: v1_admin_halls_retrieve
      description: Super Admin listing of all halls with approval status filtering.
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/halls/{id}/action/:
    post:
      operationId: v1_admin_halls_action_create
      description: 'Super Admin decision: APPROVE, REJECT, or SUSPEND listing.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/owners/:
    get:
      operationId: v1_admin_owners_retrieve
      description: |-
        Super Admin Owner Directory (Wireframe Admin Screen 2):
        Search by owner/hall name, filter by status, view venue count, joined date.
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/owners/{id}/action/:
    post:
      operationId: v1_admin_owners_action_create
      description: 'Super Admin actions on venue owners: APPROVE, SUSPEND, REACTIVATE.'
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/admin/settings/:
    get:
      operationId: v1_admin_settings_retrieve
      description: Super Admin configurable platform settings (Commission %, GST Tax
        %, Advance %, Hold TTL).
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
    patch:
      operationId: v1_admin_settings_partial_update
      description: Super Admin configurable platform settings (Commission %, GST Tax
        %, Advance %, Hold TTL).
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/auth/login/:
    post:
      operationId: v1_auth_login_create
      description: Authenticate a user with email and password.
      summary: Login
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserLoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: v1_auth_logout_create
      description: Revoke the current refresh token and clear authentication cookies.
      summary: Logout
      tags:
      - Authentication
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/me/:
    get:
      operationId: v1_auth_me_retrieve
      description: Retrieve the profile of the currently authenticated user.
      summary: Get current user
      tags:
      - Authentication
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
    patch:
      operationId: v1_auth_me_partial_update
      description: Update the profile of the currently authenticated user. Owner-specific
        fields can also be updated for hall owners.
      summary: Update current user
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUserProfileUpdateRequest'
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/password-reset/:
    post:
      operationId: v1_auth_password_reset_create
      description: Request a password reset link. The endpoint intentionally returns
        the same success response whether or not the email exists.
      summary: Request password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: v1_auth_password_reset_confirm_create
      description: Set a new password using a valid, single-use password reset token.
      summary: Confirm password reset
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: v1_auth_refresh_create
      description: Rotate the refresh token and return a new access token. The refresh
        token may be supplied in the request body or HttpOnly cookie.
      summary: Refresh access token
      tags:
      - Authentication
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RefreshTokenResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: v1_auth_register_create
      description: Register a new customer or hall owner account. Hall owner registration
        automatically creates an OwnerProfile.
      summary: Register
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UserRegistrationRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '429':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/auth/verify-email/:
    post:
      operationId: v1_auth_verify_email_create
      description: Verify a user email address using a valid, single-use email verification
        token.
      summary: Verify email
      tags:
      - Authentication
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EmailVerificationRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
          description: ''
  /api/v1/bookings/:
    get:
      operationId: v1_bookings_list
      description: Returns bookings belonging to the authenticated customer.
      summary: List customer bookings
      tags:
      - Bookings
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingList'
          description: ''
  /api/v1/bookings/{booking_id}/review/:
    post:
      operationId: v1_bookings_review_create
      description: |-
        Customer submits a review on a verified COMPLETED booking.
        Strictly restricted to completed bookings and booking owner.
      parameters:
      - in: path
        name: booking_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/bookings/{id}/:
    get:
      operationId: v1_bookings_retrieve
      description: Returns complete booking details. Access is restricted to the customer,
        hall owner, or administrator.
      summary: Get booking details
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: Booking ID
        required: true
      tags:
      - Bookings
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/accept/:
    post:
      operationId: v1_bookings_accept_create
      description: Allows the hall owner to accept a pending booking request.
      summary: Accept booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: Booking ID
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingOwnerDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingOwnerDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingOwnerDecisionRequest'
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/cancel/:
    post:
      operationId: v1_bookings_cancel_create
      description: Allows an authorized customer or hall owner to cancel an active
        booking.
      summary: Cancel booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: Booking ID
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCancellationRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCancellationRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCancellationRequest'
        required: true
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/{id}/reject/:
    post:
      operationId: v1_bookings_reject_create
      description: Allows the hall owner to reject a pending booking request.
      summary: Reject booking
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pk
        schema:
          type: string
          format: uuid
        description: Booking ID
        required: true
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingOwnerDecisionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingOwnerDecisionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingOwnerDecisionRequest'
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/bookings/create-intent/:
    post:
      operationId: v1_bookings_create_intent_create
      description: Creates a booking intent after validating the requested hall, date,
        time slot, guest count and optional services. The slot is held for 15 minutes
        while payment is completed.
      summary: Create booking intent
      tags:
      - Bookings
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookingCreateIntentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BookingCreateIntentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BookingCreateIntentRequest'
        required: true
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingDetail'
          description: ''
  /api/v1/disputes/:
    post:
      operationId: v1_disputes_create
      description: Customer lodges a formal dispute on a confirmed or completed booking.
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/favorites/:
    get:
      operationId: v1_favorites_retrieve
      description: Lists all saved function halls for the authenticated customer.
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/favorites/{hall_id}/toggle/:
    post:
      operationId: v1_favorites_toggle_create
      description: Adds or removes a venue from customer favorites.
      parameters:
      - in: path
        name: hall_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: No response body
  /api/v1/halls/:
    get:
      operationId: v1_halls_retrieve
      description: Public search endpoint returning only APPROVED & ACTIVE function
        halls.
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/halls/{id_or_slug}/:
    get:
      operationId: v1_halls_retrieve_2
      description: |-
        Public detailed view of a single function hall by slug or UUID.
        Unapproved halls are restricted unless requested by owner or admin.
      parameters:
      - in: path
        name: id_or_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - JWTAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/halls/{pk_or_slug}/reviews/:
    get:
      operationId: v1_halls_reviews_retrieve
      description: Public paginated list of verified customer reviews for a function
        hall with rating distribution.
      parameters:
      - in: path
        name: pk_or_slug
        schema:
          type: string
        required: true
      tags:
      - v1
      security:
      - {}
      responses:
        '200':
          description: No response body
  /api/v1/halls/{id}/availability/:
    get:
      operationId: v1_halls_availability_retrieve
      description: Returns the day-by-day availability matrix for a function hall.
        Year and month default to the current year and month when omitted.
      summary: Get hall monthly availability
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: query
        name: month
        schema:
          type: integer
        description: Calendar month from 1 to 12. Defaults to the current month.
      - in: path
        name: pk
        schema:
          type: integer
        description: Function hall ID.
        required: true
      - in: query
        name: year
        schema:
          type: integer
        description: Calendar year. Defaults to the current year.
      tags:
      - Availability
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallMonthAvailabilityResponse'
          description: ''
        '400':
          description: Invalid month.
        '404':
          description: Function hall not found.
  /api/v1/halls/{id}/availability/block/:
    post:
      operationId: v1_halls_availability_block_create
      description: Allows a hall owner to manually block a date and time slot for
        private use or maintenance.
      summary: Block hall time slot
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: Function hall ID.
        required: true
      tags:
      - Availability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotBlockRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SlotBlockRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SlotBlockRequestRequest'
        required: true
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Slot successfully blocked.
        '400':
          description: Invalid request.
        '404':
          description: Venue not found.
        '409':
          description: Availability conflict.
  /api/v1/halls/{id}/availability/check/:
    post:
      operationId: v1_halls_availability_check_create
      description: Checks real-time hall availability for the requested date and time
        slot and returns a server-calculated price quotation.
      summary: Check hall availability and quotation
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: Function hall ID.
        required: true
      tags:
      - Availability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AvailabilityCheckRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AvailabilityCheckRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AvailabilityCheckRequestRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HallCheckAvailabilityResponse'
          description: ''
        '400':
          description: Invalid availability parameters or guest count exceeds the
            hall's maximum capacity.
        '404':
          description: Function hall not found.
  /api/v1/halls/{id}/availability/unblock/:
    post:
      operationId: v1_halls_availability_unblock_create
      description: Allows a hall owner to unblock a previously blocked date and time
        slot.
      summary: Unblock hall time slot
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        required: true
      - in: path
        name: pk
        schema:
          type: integer
        description: Function hall ID.
        required: true
      tags:
      - Availability
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SlotUnblockRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SlotUnblockRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SlotUnblockRequestRequest'
        required: true
      security:
      - JWTAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Slot successfully unblocked.
        '400':
          description: Invalid request or slot was not blocked.
        '404':
          description: Venue not found.
        '409':
